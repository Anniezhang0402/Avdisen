[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avdisen"
version = "0.1.0"
description = "Reliability modelling of autonomous-vehicle disengagement events via mileage-adjusted NHPP, I-splines, and fractional-random-weight bootstrap"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Annie" }]
keywords = [
    "reliability", "recurrent-events", "NHPP", "autonomous-vehicles",
    "I-splines", "bootstrap", "survival-analysis", "software-reliability",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
data = ["pandas>=1.3"]
dev = ["pytest>=7.0", "matplotlib>=3.4", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/yourname/avdisen"
Paper = "https://doi.org/10.1111/rssc.12564"

[tool.setuptools.packages.find]
where = ["."]
include = ["avdisen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
